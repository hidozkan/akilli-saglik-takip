name: Import verified project source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/import-source.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify and extract source files
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, stat, zipfile
          root = pathlib.Path.cwd().resolve()
          archive = root / 'akilli-saglik-takip-github-ready.zip'
          expected = '9e806fab30c2358f31cbf684e46309b75f8fbb459cccc887d7112eb13cc8e15a'
          assert archive.exists(), 'Source archive is missing'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Archive checksum mismatch'
          with zipfile.ZipFile(archive) as bundle:
              files = [entry for entry in bundle.infolist() if not entry.is_dir()]
              assert len(files) == 172, 'Unexpected source file count'
              paths = set()
              for entry in files:
                  relative = pathlib.PurePosixPath(entry.filename)
                  assert not relative.is_absolute() and '..' not in relative.parts
                  assert '.git' not in relative.parts and '.github' not in relative.parts
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
                  assert entry.filename not in paths
                  paths.add(entry.filename)
              for entry in files:
                  target = (root / entry.filename).resolve()
                  assert target.is_relative_to(root) and not target.exists()
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.read(entry))
          source = root / 'lib/main.dart'
          source.write_text('\n'.join(line.rstrip(' \t') for line in source.read_text(encoding='utf-8').splitlines()) + '\n', encoding='utf-8')
          print('Verified and extracted 172 project files.')
          PY
      - name: Commit source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.autocrlf input
          git rm -- akilli-saglik-takip-github-ready.zip
          git add --all
          git diff --cached --check
          git commit -m 'Add health tracking system source and documentation'
          git push origin HEAD:main
